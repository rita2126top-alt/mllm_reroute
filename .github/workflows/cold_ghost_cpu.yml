name: Cold Ghost CPU checks
on:
  push:
    branches: [main]
    paths:
      - 'cold_ghost/**'
      - 'models/ghost.py'
      - 'tests/**'
      - 'configs/experiment/ghost/**'
      - 'scripts/ghost/**'
      - 'scripts/train_ghost.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      TOKENIZERS_PARALLELISM: 'false'
      JUNIT_OUT: '/tmp/cold_ghost_cpu_results.xml'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU-only pinned architecture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.4.0 accelerate==1.13.0 hydra-core==1.3.2 'pytest>=8.3,<9' pillow
      - name: Test original hashes, training, routing, native LLaVA and Qwen
        run: bash scripts/ghost/test_cpu.sh
      - name: Environment report
        if: always()
        run: |
          python -m pip freeze > /tmp/cold_ghost_cpu_packages.txt
          python -m cold_ghost.cli doctor --require-hf > /tmp/cold_ghost_cpu_environment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-ghost-cpu-verification
          path: |
            /tmp/cold_ghost_cpu_results.xml
            /tmp/cold_ghost_cpu_packages.txt
            /tmp/cold_ghost_cpu_environment.json
