name: Import original uploaded source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import_original.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import only into uninitialized repository
        shell: bash
        run: |
          set -euo pipefail
          if test -e models/patching.py; then
            echo 'Original source is already present; no files changed.'
            exit 0
          fi
          git clone --quiet https://github.com/elmma/mllm-reroute.git "$RUNNER_TEMP/reroute-source"
          git -C "$RUNNER_TEMP/reroute-source" archive 9d422042076de678b2ad67c4a6660e4b97971a1e | tar -x -C "$GITHUB_WORKSPACE"
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          # Additional scratch file in the user's uploaded ZIP, preserved byte-for-byte.
          payload = ''
          Path('test.py').write_bytes(base64.b64decode(payload))
          def obj(kind, data):
              return hashlib.sha1(kind.encode()+b' '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def tree(path):
              rows=[]
              for p in path.iterdir():
                  if p.name in ('.git', '.github'): continue
                  directory=p.is_dir()
                  sha=tree(p) if directory else obj('blob', p.read_bytes())
                  mode='40000' if directory else '100644'
                  rows.append((p.name+('/' if directory else ''), mode.encode()+b' '+p.name.encode()+b'\0'+bytes.fromhex(sha)))
              return obj('tree', b''.join(row for _,row in sorted(rows)))
          actual=tree(Path('.'))
          assert actual == '6b5b6e82b6614df2c28668983b1043a21163cd03', actual
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and '.github' not in p.parts}
          assert len(manifest)==79, len(manifest)
          Path('.github/original-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print('Verified all 79 original uploaded files, including byte-identical scratch test.py.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- .gitignore README.md bench_data configs experiments/.gitkeep lmms_eval_patches models profiler requirements.txt scripts test.py .github/original-manifest.json
          git commit -m 'chore: import 79 byte-identical files from uploaded mllm-reroute source'
          git push origin HEAD:main
