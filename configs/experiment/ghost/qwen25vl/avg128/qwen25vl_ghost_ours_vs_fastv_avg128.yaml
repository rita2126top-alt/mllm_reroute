# @package _global_
# Additive config. Original routing/model/eval settings are unchanged.
defaults:
- /eval: pope
- /model: qwen25vl_7b
- _self_
routing:
  method: pdrop
  action: compact_route
  monotonic: false
  drop_layers:
  - 3
  - 6
  - 13
  - 20
  keep_ratios:
  - 0.1418
  - 0.1418
  - 0.1418
  - 0.1418
eval:
  batch_size: 1
  log_samples: true
ghost:
  enabled: true
  budget: 128
  bottleneck_dim: 32
  num_prototypes: 8
  horizon_decisions: 1
  max_skip_age: 8
  block_share_span: 4
  partition_at_decision_only: true
  update_every_layer_in_stage: true
  enable_after_last_decision: false
  write_original_kv: false
  epsilon: 1.0e-06
  ablation: full
  checkpoint: checkpoints/cold_ghost/qwen25vl/avg128/ours_vs_fastv/best.pt
